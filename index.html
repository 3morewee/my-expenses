<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مصاريفي">
  <title>$</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts: Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 40px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header & Month Selector */
    header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .month-picker-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .month-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .month-btn:active {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(0.95);
    }

    .current-month-display {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent-blue);
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .summary-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .summary-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .summary-amount {
      font-size: 0.95rem;
      font-weight: 800;
      word-break: break-all;
    }

    .text-green { color: var(--accent-green); }
    .text-red { color: var(--accent-red); }
    .text-blue { color: var(--accent-blue); }

    /* Form */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .type-toggle {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .type-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .type-btn.active.expense {
      background: var(--accent-red);
      color: white;
    }

    .type-btn.active.income {
      background: var(--accent-green);
      color: white;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--accent-blue);
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    /* Transactions List */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-left: 4px;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }

    .trans-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .trans-title {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .trans-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .trans-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .trans-amount {
      font-weight: 800;
      font-size: 0.95rem;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent-red);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }

    /* Actions & Backup */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn:active {
      background: rgba(255, 255, 255, 0.12);
    }

    .chart-container {
      position: relative;
      height: 200px;
      width: 100%;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      font-size: 0.85rem;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <div class="app-title">📊 مصاريفي الشخصية</div>
      </div>
      <!-- Month Navigation -->
      <div class="month-picker-container">
        <button class="month-btn" id="prevMonth">الشهر السابق</button>
        <div class="current-month-display" id="monthDisplay">---</div>
        <button class="month-btn" id="nextMonth">الشهر التالي</button>
      </div>
    </header>

    <!-- Summary -->
    <div class="summary-grid">
      <div class="summary-box">
        <div class="summary-title">الدخل</div>
        <div class="summary-amount text-green" id="totalIncome">0</div>
      </div>
      <div class="summary-box">
        <div class="summary-title">المصاريف</div>
        <div class="summary-amount text-red" id="totalExpense">0</div>
      </div>
      <div class="summary-box">
        <div class="summary-title">المتبقي</div>
        <div class="summary-amount text-blue" id="netBalance">0</div>
      </div>
    </div>

    <!-- Form -->
    <div class="card">
      <form id="transForm" class="form-group">
        <div class="form-title">إضافة عملية جديدة</div>
        
        <div class="type-toggle">
          <button type="button" class="type-btn active expense" id="typeExpenseBtn" onclick="setType('expense')">مصروف</button>
          <button type="button" class="type-btn income" id="typeIncomeBtn" onclick="setType('income')">دخل</button>
        </div>

        <input type="text" id="titleInput" class="input-field" placeholder="الوصف (مثال: مطعم، راتب)" required>
        <input type="number" id="amountInput" class="input-field" placeholder="المبلغ" step="any" required>
        
        <select id="categorySelect" class="select-field">
          <option value="طعام ومأكولات">🍔 طعام ومأكولات</option>
          <option value="فواتير وسكن">🏠 فواتير وسكن</option>
          <option value="مواصلات">السيارة والمواصلات</option>
          <option value="تسوق وترفيه">🛍️ تسوق وترفيه</option>
          <option value="صحة">💊 صحة وطبابة</option>
          <option value="دخل">💰 دخل وراتب</option>
          <option value="أخرى">📦 أخرى</option>
        </select>

        <button type="submit" class="submit-btn">حفظ العملية</button>
      </form>
    </div>

    <!-- Chart -->
    <div class="card">
      <div class="form-title">توزيع المصاريف</div>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>

    <!-- Transactions List -->
    <div class="card">
      <div class="list-header">
        <div class="form-title">سجل عمليات الشهر</div>
      </div>
      <div class="transaction-list" id="transactionList">
        <div class="empty-state">لا توجد عمليات مسجلة لهذا الشهر</div>
      </div>
    </div>

    <!-- Export & Backup Actions -->
    <div class="card">
      <div class="form-title" style="margin-bottom: 10px;">إدارة وحفظ البيانات (محلياً)</div>
      <div class="actions-grid">
        <button class="action-btn" onclick="exportToCSV()">📄 تصدير CSV (Excel)</button>
        <button class="action-btn" onclick="exportJSON()">💾 نسخة احتياطية (JSON)</button>
        <button class="action-btn" onclick="document.getElementById('fileInput').click()" style="grid-column: span 2;">📥 استعادة نسخة احتياطية</button>
        <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
      </div>
    </div>
  </div>

  <script>
    // App State
    let currentDate = new Date();
    let currentType = 'expense';
    let transactions = JSON.parse(localStorage.getItem('my_expenses_data')) || [];
    let chartInstance = null;

    // Elements
    const monthDisplay = document.getElementById('monthDisplay');
    const totalIncomeEl = document.getElementById('totalIncome');
    const totalExpenseEl = document.getElementById('totalExpense');
    const netBalanceEl = document.getElementById('netBalance');
    const transactionListEl = document.getElementById('transactionList');
    const transForm = document.getElementById('transForm');

    // Init
    window.onload = () => {
      updateMonthDisplay();
      renderApp();
      
      document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
      document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));
    };

    function setType(type) {
      currentType = type;
      const expBtn = document.getElementById('typeExpenseBtn');
      const incBtn = document.getElementById('typeIncomeBtn');
      if (type === 'expense') {
        expBtn.classList.add('active');
        incBtn.classList.remove('active');
      } else {
        incBtn.classList.add('active');
        expBtn.classList.remove('active');
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      updateMonthDisplay();
      renderApp();
    }

    function updateMonthDisplay() {
      const year = currentDate.getFullYear();
      const month = currentDate.toLocaleString('ar', { month: 'long' });
      monthDisplay.textContent = `${month} ${year}`;
    }

    function getCurrentMonthKey() {
      const year = currentDate.getFullYear();
      const month = String(currentDate.getMonth() + 1).padStart(2, '0');
      return `${year}-${month}`;
    }

    // Add Transaction
    transForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('titleInput').value.trim();
      const amount = parseFloat(document.getElementById('amountInput').value);
      const category = document.getElementById('categorySelect').value;

      if (!title || isNaN(amount) || amount <= 0) return;

      const newTrans = {
        id: Date.now(),
        title,
        amount,
        category,
        type: currentType,
        date: new Date().toISOString(),
        monthKey: getCurrentMonthKey()
      };

      transactions.push(newTrans);
      saveData();
      
      document.getElementById('titleInput').value = '';
      document.getElementById('amountInput').value = '';
      renderApp();
    });

    function deleteTransaction(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveData();
      renderApp();
    }

    function saveData() {
      localStorage.setItem('my_expenses_data', JSON.stringify(transactions));
    }

    function renderApp() {
      const currentMonthKey = getCurrentMonthKey();
      const monthTrans = transactions.filter(t => t.monthKey === currentMonthKey);

      // Calculations
      let income = 0;
      let expense = 0;
      monthTrans.forEach(t => {
        if (t.type === 'income') income += t.amount;
        else expense += t.amount;
      });

      totalIncomeEl.textContent = income.toLocaleString();
      totalExpenseEl.textContent = expense.toLocaleString();
      netBalanceEl.textContent = (income - expense).toLocaleString();

      // Render List
      transactionListEl.innerHTML = '';
      if (monthTrans.length === 0) {
        transactionListEl.innerHTML = `<div class="empty-state">لا توجد عمليات مسجلة لهذا الشهر</div>`;
      } else {
        monthTrans.slice().reverse().forEach(t => {
          const item = document.createElement('div');
          item.className = 'transaction-item';
          const isInc = t.type === 'income';
          const dateStr = new Date(t.date).toLocaleDateString('ar', { day: 'numeric', month: 'numeric' });

          item.innerHTML = `
            <div class="trans-info">
              <div class="trans-title">${t.title}</div>
              <div class="trans-meta">${t.category} • ${dateStr}</div>
            </div>
            <div class="trans-right">
              <div class="trans-amount ${isInc ? 'text-green' : 'text-red'}">
                ${isInc ? '+' : '-'}${t.amount.toLocaleString()}
              </div>
              <button class="delete-btn" onclick="deleteTransaction(${t.id})">✕</button>
            </div>
          `;
          transactionListEl.appendChild(item);
        });
      }

      renderChart(monthTrans);
    }

    function renderChart(monthTrans) {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      const expenses = monthTrans.filter(t => t.type === 'expense');

      const categories = {};
      expenses.forEach(t => {
        categories[t.category] = (categories[t.category] || 0) + t.amount;
      });

      const labels = Object.keys(categories);
      const data = Object.values(categories);

      if (chartInstance) {
        chartInstance.destroy();
      }

      if (labels.length === 0) {
        ctx.clearRect(0, 0, 200, 200);
        return;
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: [
              '#ef4444', '#3b82f6', '#10b981', '#f59e0b', 
              '#8b5cf6', '#ec4899', '#64748b'
            ],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#f8fafc', font: { family: 'Cairo', size: 11 } }
            }
          }
        }
      });
    }

    // Export CSV
    function exportToCSV() {
      const currentMonthKey = getCurrentMonthKey();
      const monthTrans = transactions.filter(t => t.monthKey === currentMonthKey);

      if (monthTrans.length === 0) {
        alert('لا توجد بيانات لتصديرها لهذا الشهر.');
        return;
      }

      let csvContent = "\uFEFFالنوع,الوصف,المبلغ,الفئة,التاريخ\n";
      monthTrans.forEach(t => {
        const typeStr = t.type === 'income' ? 'دخل' : 'مصروف';
        const dateStr = new Date(t.date).toLocaleDateString('ar');
        csvContent += `"${typeStr}","${t.title}","${t.amount}","${t.category}","${dateStr}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `مصاريف_${currentMonthKey}.csv`;
      link.click();
    }

    // Export JSON
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `نسخة_احتياطية_مصاريفي_${getCurrentMonthKey()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Import JSON
    function importJSON(event) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            transactions = importedData;
            saveData();
            renderApp();
            alert('تم استعادة النسخة الاحتياطية بنجاح!');
          }
        } catch (err) {
          alert('الملف غير صالح.');
        }
      };
      reader.readAsText(event.target.files[0]);
    }
  </script>
</body>
</html>
